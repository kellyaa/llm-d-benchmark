# CKS (Cloud Kubernetes Service) CI/CD Scenario - Nop
# Variant of cicd/cks.yaml with Nop for FMA and standalone.

scenario:
  - name: "cks-cicd"

    model:
      name: facebook/opt-125m
      shortName: facebook-opt-125m
      path: models/facebook/opt-125m
      huggingfaceId: facebook/opt-125m

    decode:
      enabled: false
    modelservice:
      enabled: false
    standalone:
      enabled: true
      acceleratorType:
        labelKey: gpu.nvidia.com/class
        labelValue: H200
    fma:
      enabled: true
      iterations: 5
      launcher:
        runtimeClassName: ""

    gateway:
      className: agentgateway

    affinity:
      enabled: true
      nodeSelector:
        gpu.nvidia.com/class: H200

    vllmCommon:
      priorityClassName: nightly-gpu-critical

    storage:
      modelPvc:
        storageClassName: shared-vast

    workDir: /tmp/llmdbenchcicd-cks/

    harness:
      name: nop
      experimentProfile: nop.yaml
      executable: llm-d-benchmark.py

    images:
      benchmark:
        repository: ghcr.io/llm-d/llm-d-benchmark
        tag: nightly
