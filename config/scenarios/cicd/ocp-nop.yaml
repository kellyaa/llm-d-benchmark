# OpenShift Container Platform CI/CD Scenario - Nop
# Variant of cicd/ocp.yaml with Nop for FMA and standalone.

scenario:
  - name: "ocp-cicd"

    model:
      name: facebook/opt-125m
      shortName: facebook-opt-125m
      path: models/facebook/opt-125m
      huggingfaceId: facebook/opt-125m

    affinity:
      enabled: true
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3

    decode:
      enabled: false
    modelservice:
      enabled: false
    standalone:
      enabled: true
      acceleratorType:
        labelKey: nvidia.com/gpu.product
        labelValue: NVIDIA-H100-80GB-HBM3
    fma:
      enabled: true
      iterations: 5

    vllmCommon:
      priorityClassName: nightly-gpu-critical

    workDir: /tmp/llmdbenchcicd-ocp/

    harness:
      name: nop
      experimentProfile: nop.yaml
      executable: llm-d-benchmark.py

    images:
      benchmark:
        repository: ghcr.io/llm-d/llm-d-benchmark
        tag: nightly
